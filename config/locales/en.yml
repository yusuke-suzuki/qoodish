# Files in the config/locales directory are used for internationalization
# and are automatically loaded by Rails. If you want to use locales other
# than English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t 'hello'
#
# In views, this is aliased to just `t`:
#
#     <%= t('hello') %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# The following keys must be escaped otherwise they will not be retrieved by
# the default I18n backend:
#
# true, false, on, off, yes, no
#
# Instead, surround them with single quotes.
#
# en:
#   'true': 'foo'
#
# To learn more, please read the Rails Internationalization guide
# available at https://guides.rubyonrails.org/i18n.html.

en:
  activerecord:
    attributes:
      report:
        category: Reason for reporting
        details: Details
        locale: Language
        moderatable: Target
        moderatable_id: Target
        moderatable_type: Target type
        reporter: Reporter
      moderation_decision:
        moderatable: Target
        moderatable_type: Target type
        outcome: Outcome
        reason: Reason
        staff_member: Staff member
      admin/staff_member:
        email: Email
    errors:
      models:
        report:
          attributes:
            category:
              inclusion: must be selected.
            details:
              blank: must be filled in.
              too_long: must be %{count} characters or fewer.
            locale:
              inclusion: is not supported.
            moderatable:
              blank: could not be found.
            moderatable_id:
              taken: has already been reported by you and is being reviewed.
            moderatable_type:
              inclusion: cannot be reported.
            reporter:
              blank: could not be found. Sign in to report.
              other_than: is the author and cannot report their own post.
        moderation_decision:
          attributes:
            moderatable:
              blank: is gone. Choose "Close because the content is gone" instead.
              present: is still there. Choose "Keep the content" or "Remove the content" instead.
            moderatable_type:
              exclusion: is an account or a journal, which cannot be removed. Choose "Keep the content" instead.
              inclusion: is not supported.
            outcome:
              inclusion: must be selected.
            reason:
              blank: must be filled in.
            staff_member:
              blank: could not be found.
        admin/staff_member:
          attributes:
            email:
              blank: must be filled in.
              invalid: is not a valid email address.
              taken: is already registered.
