en:
  moderation:
    categories:
      spam: Spam or advertising
      harassment: Harassment or bullying
      hate: Hate speech or discrimination
      sexual: Sexual content
      violence: Violent or graphic content
      illegal: Illegal activity or content
      privacy: Privacy violation or defamation
      copyright: Copyright or trademark infringement
      impersonation: Impersonation
      other: Something else
    outcomes:
      kept: We did not find that the reported content violates our Terms of Service, so we did not remove it or take any other measure.
      removed: We found that the reported content violates our Terms of Service and removed it.
      unavailable: The reported content had already been deleted when we reviewed it.
  moderation_mailer:
    report_received:
      subject: "[Qoodish] New report #%{id}"
    report_acknowledged:
      subject: "[Qoodish] We received your report (#%{id})"
    decision_notified:
      subject: "[Qoodish] The outcome of your report (#%{id})"
    content_removed:
      subject: "[Qoodish] Your content has been removed"
