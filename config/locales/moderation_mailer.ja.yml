ja:
  moderation:
    categories:
      spam: スパム・宣伝
      harassment: 嫌がらせ・いじめ
      hate: 差別・ヘイトスピーチ
      sexual: 性的なコンテンツ
      violence: 暴力的・残虐なコンテンツ
      illegal: 違法な行為・コンテンツ
      privacy: プライバシー侵害・名誉毀損
      copyright: 著作権・商標などの権利侵害
      impersonation: なりすまし
      other: その他
    outcomes:
      kept: 利用規約に違反するとは判断しなかったため、報告された投稿の削除その他の措置は行いませんでした。
      removed: 利用規約に違反すると判断し、報告された投稿を削除しました。
      unavailable: 確認した時点で、報告された投稿はすでに削除されていました。
  moderation_mailer:
    report_received:
      subject: "[Qoodish] 新しい報告 #%{id}"
    report_acknowledged:
      subject: "[Qoodish] 報告を受け付けました (#%{id})"
    decision_notified:
      subject: "[Qoodish] 報告への対応が完了しました (#%{id})"
    content_removed:
      subject: "[Qoodish] 投稿を削除しました"
