        outcome: 対応結果
        reason: 理由
        staff_member: 担当者
    errors:
      models:
        report:
          format: "%{attribute}%{message}"
          attributes:
            category:
              inclusion: を選択してください。
            details:
              blank: をご記入ください。
              too_long: は %{count} 文字以内でご記入ください。
            evidence_url:
              format: "%{attribute} %{message}"
              invalid: は http:// または https:// で始めてください。
              too_long: は %{count} 文字以内でご記入ください。
            locale:
              inclusion: がサポート対象外です。
            moderatable:
              blank: が見つかりません。
            moderatable_id:
              taken: は報告済みで、現在確認中です。
            moderatable_type:
              inclusion: は報告できません。
            reporter:
              blank: が見つかりません。ログインしてから報告してください。
              other_than: が投稿者本人のため報告できません。
        moderation_decision:
          format: "%{attribute}%{message}"
          attributes:
            moderatable:
              blank: は既に存在しません。「対象がないため終了する」を選んでください。
              present: はまだ存在します。「対象を維持する」か「対象を非表示にする」を選んでください。
            moderatable_type:
              exclusion: がアカウントか手帳の場合は、非表示にできません。「対象を維持する」を選んでください。
              inclusion: がサポート対象外です。
            outcome:
              inclusion: を選択してください。
            reason:
              blank: を入力してください。
            staff_member:
              blank: が見つかりません。
