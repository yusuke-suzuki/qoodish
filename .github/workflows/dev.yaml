name: Dev
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
env:
  PROJECT_ID: qoodish-dev
  REGION: asia-northeast1
  ARTIFACT_REGISTRY: asia-northeast1-docker.pkg.dev
  SERVICE_NAME: qoodish-api
  JOB_NAME: qoodish-runner

jobs:
  test:
    concurrency:
      group: dev-test-${{ github.event.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v1
        with:
          token_format: access_token
          workload_identity_provider: projects/438842534630/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: github-actions@qoodish-common.iam.gserviceaccount.com
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
      - name: Decrypt secrets
        run: |
          gcloud secrets versions access latest \
            --secret=QOODISH_API_DOTENV \
            --project=$PROJECT_ID \
            --out-file=.env
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true
      - name: Rails test
        env:
          DB_USER: root
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
        run: |
          bundle exec rails db:setup
          bundle exec rails test

  build-and-push-image:
    needs: test
    concurrency:
      group: dev-build-${{ github.event.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v1
        with:
          token_format: access_token
          workload_identity_provider: projects/438842534630/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: github-actions@qoodish-common.iam.gserviceaccount.com
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
      - name: Decrypt secrets
        run: |
          gcloud secrets versions access latest \
            --secret=QOODISH_API_DOTENV \
            --project=$PROJECT_ID \
            --out-file=.env
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GAR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ARTIFACT_REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}/${{ env.SERVICE_NAME }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            type=ref,event=pr,prefix=pr-,suffix=
            type=sha,prefix=,suffix=,format=long
      - name: Build and push image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs:
      - build-and-push-image
    concurrency:
      group: dev-deploy
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    runs-on: ubuntu-latest
    env:
      RELEASE_CANDIDATE: ${{ github.head_ref == 'release-please--branches--master' && github.base_ref == 'master' && github.event.pull_request.head.repo.full_name == github.repository }}
      CLOUDSDK_CORE_DISABLE_PROMPTS: 1
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: projects/438842534630/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: github-actions@qoodish-common.iam.gserviceaccount.com
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
      - name: Deploy Job using kustomize
        if: env.RELEASE_CANDIDATE == 'true'
        working-directory: run/dev/runner
        env:
          IMAGE_URL: ${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
        run: |
          echo "Setting image to $IMAGE_URL"
          kustomize edit set image IMAGE_PLACEHOLDER=$IMAGE_URL

          echo "--- Generated job manifest ---"
          kustomize build .
          echo "----------------------------"

          kustomize build . | gcloud run jobs replace - \
            --project=$PROJECT_ID \
            --region=$REGION
      - name: Run db:migrate on the Job carrying this image
        if: env.RELEASE_CANDIDATE == 'true'
        run: |
          EXECUTION=$(gcloud run jobs execute $JOB_NAME \
            --args=bin/rails,db:migrate \
            --wait \
            --format='value(metadata.name)' \
            --project=$PROJECT_ID \
            --region=$REGION)

          echo "Migration execution: ${EXECUTION:-unknown}"

          if [ -n "$EXECUTION" ]; then
            FAILED=$(gcloud run jobs executions describe $EXECUTION \
              --format='value(status.failedCount)' \
              --project=$PROJECT_ID \
              --region=$REGION)

            if [ -n "$FAILED" ] && [ "$FAILED" != "0" ]; then
              echo "The migration execution reported $FAILED failed task(s)"
              exit 1
            fi
          fi
      - name: Deploy the Job that destroys unattached images
        if: env.RELEASE_CANDIDATE == 'true'
        working-directory: run/dev/destroy-unattached-images
        env:
          IMAGE_URL: ${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
        run: |
          echo "Setting image to $IMAGE_URL"
          kustomize edit set image IMAGE_PLACEHOLDER=$IMAGE_URL

          echo "--- Generated job manifest ---"
          kustomize build .
          echo "----------------------------"

          kustomize build . | gcloud run jobs replace - \
            --project=$PROJECT_ID \
            --region=$REGION
      - name: Record the traffic tags of open PRs
        id: tags
        if: env.RELEASE_CANDIDATE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPEN_PR_TAGS=$(gh pr list \
            --repo ${{ github.repository }} \
            --state open \
            --limit 1000 \
            --json number \
            --jq '[.[] | "pr-\(.number)"]')

          TAGS=$(gcloud run services describe $SERVICE_NAME \
            --format=json \
            --project=$PROJECT_ID \
            --region=$REGION \
            | jq -r --arg own "pr-${{ github.event.number }}" --argjson open "$OPEN_PR_TAGS" \
              '[.spec.traffic[]? | select(.tag and .revisionName and .tag != $own) | select(.tag as $tag | any($open[]; . == $tag)) | "\(.tag)=\(.revisionName)"] | join(",")')
          echo "Tags to keep: ${TAGS:-none}"
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
      - name: Deploy Service using kustomize
        if: env.RELEASE_CANDIDATE == 'true'
        working-directory: run/dev/api
        env:
          IMAGE_URL: ${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
        run: |
          echo "Setting image to $IMAGE_URL"
          kustomize edit set image IMAGE_PLACEHOLDER=$IMAGE_URL

          echo "--- Generated service manifest ---"
          kustomize build .
          echo "----------------------------------"

          kustomize build . | gcloud run services replace - \
            --project=$PROJECT_ID \
            --region=$REGION
      - name: Tag the new revision and restore the PR tags
        if: env.RELEASE_CANDIDATE == 'true'
        env:
          KEPT_TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          REVISION=$(gcloud run services describe $SERVICE_NAME \
            --format='value(status.latestReadyRevisionName)' \
            --project=$PROJECT_ID \
            --region=$REGION)

          gcloud run services update-traffic $SERVICE_NAME \
            --update-tags=${KEPT_TAGS:+$KEPT_TAGS,}pr-${{ github.event.number }}=$REVISION \
            --project=$PROJECT_ID \
            --region=$REGION
      - name: Deploy a tagged revision without traffic
        if: env.RELEASE_CANDIDATE != 'true'
        env:
          IMAGE_URL: ${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image=$IMAGE_URL \
            --no-traffic \
            --tag=pr-${{ github.event.number }} \
            --project=$PROJECT_ID \
            --region=$REGION
