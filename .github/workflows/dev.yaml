name: Dev
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: |
          pnpm install
      # pnpm install only warns about an unmet peer.
      - name: Check peer dependencies
        run: |
          pnpm peers check
      - name: Lint
        run: |
          pnpm lint
      - name: Type check
        run: |
          pnpm typecheck
      - name: Test
        run: |
          pnpm test
