name: Dev
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
env:
  PROJECT_ID: qoodish-dev
  REGION: asia-northeast1
  ARTIFACT_REGISTRY: asia-northeast1-docker.pkg.dev
  SERVICE_NAME: qoodish-api
  JOB_NAME: qoodish-runner

jobs:
  test:
    concurrency:
      group: dev-test-${{ github.event.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v1
        with:
          token_format: access_token
          workload_identity_provider: projects/438842534630/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: github-actions@qoodish-common.iam.gserviceaccount.com
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
      - name: Decrypt secrets
        run: |
          gcloud secrets versions access latest \
            --secret=QOODISH_API_DOTENV \
            --project=$PROJECT_ID \
            --out-file=.env
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true
      - name: Rails test
        env:
          DB_USER: root
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
        run: |
          bundle exec rails db:setup
          bundle exec rails test

  migrations:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse changes to migrations dev may have applied
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.action == 'synchronize' && github.event.before || '' }}
        run: |
          refs=("$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")")

          if [ -n "$BEFORE_SHA" ]; then
            if git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null || git fetch --quiet --no-tags origin "$BEFORE_SHA"; then
              refs+=("$BEFORE_SHA")
            else
              echo "::warning::Could not fetch the previous head $BEFORE_SHA; checking against $BASE_REF only."
            fi
          fi

          status=0
          for ref in "${refs[@]}"; do
            changed=$(git diff --name-status --diff-filter=DMR "$ref" "$HEAD_SHA" -- db/migrate)
            if [ -n "$changed" ]; then
              echo "::error::Migrations changed since $ref:"
              echo "$changed"
              status=1
            fi
          done

          if [ "$status" -ne 0 ]; then
            echo "The dev deploy runs db:migrate on every push, so dev may already have applied these files."
            echo "db:migrate never reruns an applied version, so an edit would not reach dev and its schema would drift."
            echo "Restore the files and add a new migration for the change instead."
          fi

          exit $status

  build-and-push-image:
    needs:
      - test
      - migrations
    concurrency:
      group: dev-build-${{ github.event.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v1
        with:
          token_format: access_token
          workload_identity_provider: projects/438842534630/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: github-actions@qoodish-common.iam.gserviceaccount.com
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
      - name: Decrypt secrets
        run: |
          gcloud secrets versions access latest \
            --secret=QOODISH_API_DOTENV \
            --project=$PROJECT_ID \
            --out-file=.env
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GAR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ARTIFACT_REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}/${{ env.SERVICE_NAME }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            type=ref,event=pr,prefix=pr-,suffix=
            type=sha,prefix=,suffix=,format=long
      - name: Build and push image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs:
      - build-and-push-image
    concurrency:
      group: dev-deploy
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: projects/438842534630/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: github-actions@qoodish-common.iam.gserviceaccount.com
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
      - name: Deploy Job using kustomize
        working-directory: run/dev/runner
        env:
          IMAGE_URL: ${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          CLOUDSDK_CORE_DISABLE_PROMPTS: 1
        run: |
          echo "Setting image to $IMAGE_URL"
          kustomize edit set image IMAGE_PLACEHOLDER=$IMAGE_URL

          echo "--- Generated job manifest ---"
          kustomize build .
          echo "----------------------------"

          kustomize build . | gcloud run jobs replace - \
            --project=$PROJECT_ID \
            --region=$REGION
      - name: Run db:migrate on the Job carrying this image
        env:
          CLOUDSDK_CORE_DISABLE_PROMPTS: 1
        run: |
          EXECUTION=$(gcloud run jobs execute $JOB_NAME \
            --args=bin/rails,db:migrate \
            --wait \
            --format='value(metadata.name)' \
            --project=$PROJECT_ID \
            --region=$REGION)

          echo "Migration execution: ${EXECUTION:-unknown}"

          if [ -n "$EXECUTION" ]; then
            FAILED=$(gcloud run jobs executions describe $EXECUTION \
              --format='value(status.failedCount)' \
              --project=$PROJECT_ID \
              --region=$REGION)

            if [ -n "$FAILED" ] && [ "$FAILED" != "0" ]; then
              echo "The migration execution reported $FAILED failed task(s)"
              exit 1
            fi
          fi
      - name: Deploy Service using kustomize
        working-directory: run/dev/api
        env:
          IMAGE_URL: ${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          CLOUDSDK_CORE_DISABLE_PROMPTS: 1
        run: |
          echo "Setting image to $IMAGE_URL"
          kustomize edit set image IMAGE_PLACEHOLDER=$IMAGE_URL

          echo "--- Generated service manifest ---"
          kustomize build .
          echo "----------------------------------"

          kustomize build . | gcloud run services replace - \
            --project=$PROJECT_ID \
            --region=$REGION
      - name: Update traffic tag to the new revision
        env:
          CLOUDSDK_CORE_DISABLE_PROMPTS: 1
        run: |
          gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
            --update-tags=pr-${{ github.event.number }}=LATEST \
            --project=$PROJECT_ID \
            --region=$REGION
